<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Aluno</title>
</head>
<body>
   
    <h2>Cadastrar Estudante</h2>
    <form action="/aluno" method="post">  
        Matricula: <input type="text" id="matricula" name="matricula"><br><br> 
        Nome: <input type="text" id="nome" name="nome"><br><br>
        E-mail: <input type="email" id="email" name="email"><br><br>
        Telefone: <input type="tel" id="tel" name="tel"><br><br>
        Curso: <input type="text" id="curso" name="curso"><br><br>
        <button type="submit">Salvar</button>
    </form>
    
</body>
</html>
