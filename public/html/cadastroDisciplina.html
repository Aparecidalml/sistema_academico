<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Disciplina</title>
</head>
<body>
   
    <h2>Cadastrar Disciplina</h2>
    <form action="/disciplina" method="post">  
        Código: <input type="text" id="cod_disciplina" name="cod_disciplina"><br><br> 
        Nome: <input type="text" id="disciplina" name="disciplina"><br><br>
        Carga Horária: <input type="text" id="ch_disciplina" name="ch_disciplina"><br><br>
        Professor: <input type="text" id="prof" name="prof"><br><br>
        Curso: <input type="text" id="curso" name="curso"><br><br>
        <button type="submit">Salvar</button>
    </form>
    
</body>
</html>
